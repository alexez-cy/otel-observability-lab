name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck yamllint
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Load versions
        run: cat config/versions.env >> "$GITHUB_ENV"

      - name: ShellCheck
        run: shellcheck scripts/*.sh

      - name: YAML lint
        run: yamllint manifests helm

      - name: Add Helm repositories
        run: |
          helm repo add open-telemetry \
            https://open-telemetry.github.io/opentelemetry-helm-charts

          helm repo add grafana \
            https://grafana.github.io/helm-charts

          helm repo add vm \
            https://victoriametrics.github.io/helm-charts

          helm repo add jaegertracing \
            https://jaegertracing.github.io/helm-charts

          helm repo add jetstack \
            https://charts.jetstack.io

          helm repo update

      - name: Helm lint
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p /tmp/helm-charts

          helm pull jetstack/cert-manager \
            --version "${CERT_MANAGER_VERSION}" \
            --untar \
            --untardir /tmp/helm-charts

          helm lint /tmp/helm-charts/cert-manager \
            --set crds.enabled=true

          helm pull open-telemetry/opentelemetry-operator \
            --version "${OTEL_OPERATOR_VERSION}" \
            --untar \
            --untardir /tmp/helm-charts

          helm lint /tmp/helm-charts/opentelemetry-operator \
            -f helm/opentelemetry-operator/values.yaml

          helm pull vm/victoria-metrics-single \
            --version "${VICTORIA_METRICS_VERSION}" \
            --untar \
            --untardir /tmp/helm-charts

          helm lint /tmp/helm-charts/victoria-metrics-single \
            -f helm/victoria-metrics/values.yaml

          helm pull jaegertracing/jaeger \
            --version "${JAEGER_VERSION}" \
            --untar \
            --untardir /tmp/helm-charts

          helm lint /tmp/helm-charts/jaeger

          helm pull grafana/grafana \
            --version "${GRAFANA_VERSION}" \
            --untar \
            --untardir /tmp/helm-charts

          helm lint /tmp/helm-charts/grafana \
            -f helm/grafana/values.yaml

          helm pull open-telemetry/opentelemetry-demo \
            --version "${OTEL_DEMO_VERSION}" \
            --untar \
            --untardir /tmp/helm-charts

          helm lint /tmp/helm-charts/opentelemetry-demo \
            -f helm/otel-demo/values.yaml 